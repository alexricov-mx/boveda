<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BER — Cargando</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: linear-gradient(135deg, #691c32 0%, #4a1325 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Segoe UI', Roboto, sans-serif;
        color: #fff;
      }
      .container { text-align: center; }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top-color: #bc955c;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin: 0 auto 24px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
      p { font-size: 0.875rem; opacity: 0.75; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner"></div>
      <h1>Bóveda Electrónica de Recepción</h1>
      <p>Petróleos Mexicanos</p>
    </div>
  </body>
</html>
